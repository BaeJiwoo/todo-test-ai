app: app-eec35d9ba8d94f648be5
source:
  repo: https://github.com/BaeJiwoo/todo-test-ai
  commit: 585c2796b7d7b9c53335edaff66009d67c9b0d68
build:
  dockerfile: Dockerfile
  runtime_hint: python3.12
port: 8080
healthcheck: /healthz
ingress: public
env:
- name: LOG_LEVEL
  secret: false
  generate: false
  value: INFO
- name: SECRET_KEY
  secret: true
  generate: false
backing_services: []
workload:
  type: request-driven
  scale_to_zero: true
  max_request_seconds: 10
  websocket: false
processes:
  web:
    instances: 1
profile: dev
